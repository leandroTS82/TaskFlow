services:
  mongo:
    image: mongo:7.0
    container_name: taskflow-mongo
    command: >
      bash -c "
        cp /etc/mongo/keyfile-src /etc/mongo/keyfile &&
        chmod 400 /etc/mongo/keyfile &&
        chown mongodb:mongodb /etc/mongo/keyfile &&
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo/keyfile
      "
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./infra/mongo/keyfile:/etc/mongo/keyfile-src:ro
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD", "mongosh", "-u", "root", "-p", "password", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  mongo-init:
    image: mongo:7.0
    container_name: taskflow-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./infra/mongo/rs-init.sh:/rs-init.sh:ro
    entrypoint: ["bash", "/rs-init.sh"]
    networks:
      - taskflow-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: taskflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - taskflow-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  taskflow.api:
    build:
      context: .
      dockerfile: src/TaskFlow.API/Dockerfile
    container_name: taskflow-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Api__ApiKey=dev-api-key-example
      - MongoDB__ConnectionString=mongodb://root:password@mongo:27017/?authSource=admin&replicaSet=rs0&directConnection=true
      - MongoDB__DatabaseName=taskflow
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taskflow-net

  taskflow.processor:
    build:
      context: .
      dockerfile: src/TaskFlow.Processor/Dockerfile
    container_name: taskflow-processor
    environment:
      - DOTNET_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://root:password@mongo:27017/?authSource=admin&replicaSet=rs0&directConnection=true
      - MongoDB__DatabaseName=taskflow
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Processor__IntervalSeconds=5
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - taskflow-net

  taskflow.worker:
    build:
      context: .
      dockerfile: src/TaskFlow.Worker/Dockerfile
    container_name: taskflow-worker
    environment:
      - DOTNET_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://root:password@mongo:27017/?authSource=admin&replicaSet=rs0&directConnection=true
      - MongoDB__DatabaseName=taskflow
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - taskflow-net

volumes:
  mongo_data:
  rabbitmq_data:

networks:
  taskflow-net:
    driver: bridge